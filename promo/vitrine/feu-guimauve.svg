@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(80px) rotate(200deg);opacity:0}}
.scintille{animation:scintille .8s steps(2) infinite}
@keyframes scintille{50%{opacity:.2}}
